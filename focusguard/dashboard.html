<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusGuard Dashboard</title>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <section id="view-auth" class="container auth-container">
    <h1>FocusGuard</h1>
    <form id="auth-form" autocomplete="off">
      <label for="auth-password">Parent password</label>
      <input id="auth-password" type="password" autofocus required>
      <button type="submit">Unlock</button>
      <p id="auth-error" class="error" hidden></p>
    </form>
  </section>

  <section id="view-main" class="container main-container" hidden>
    <header class="header">
      <h1>FocusGuard</h1>
      <div class="header-controls">
        <label for="date-picker" class="sr-only">Date</label>
        <select id="date-picker" aria-label="Date"></select>
        <button id="refresh-btn" class="ghost" type="button">Refresh</button>
        <button id="logout-btn" class="ghost">Log out</button>
      </div>
    </header>

    <section class="stats" id="stats">
      <div class="stat">
        <div class="stat-label">Time online</div>
        <div class="stat-value" id="stat-time">&mdash;</div>
      </div>
      <div class="stat">
        <div class="stat-label">Educational</div>
        <div class="stat-value" id="stat-educational">&mdash;</div>
      </div>
      <div class="stat">
        <div class="stat-label">Blocked</div>
        <div class="stat-value" id="stat-blocked">&mdash;</div>
      </div>
      <div class="stat stat-wide">
        <div class="stat-label">Top domains</div>
        <ol class="stat-list" id="stat-top-domains"></ol>
      </div>
    </section>

    <section class="feed" id="feed" aria-live="polite"></section>
    <p class="muted empty-state" id="empty-state" hidden>No activity for this day.</p>
  </section>

  <script src="dashboard.js"></script>
</body>
</html>
